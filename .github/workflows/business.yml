name: business-curadoria
on:
  schedule:
    - cron: '43 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: business-curadoria
  cancel-in-progress: false
jobs:
  candidatos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_business*.py'
      - run: python scripts/coletar_business.py
      - run: python scripts/coletar_business_videos.py
      - name: Guardar candidatos sem publicar conteúdo
        run: |
          git config user.name 'harpya-bot'
          git config user.email 'harpya-bot@users.noreply.github.com'
          git add curadoria/business/candidatos.json curadoria/business/videos-candidatos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'curadoria: atualizar candidatos Business'
          git push
