# Atualiza public/data/news.json a cada 6 horas. O commit dispara um novo deploy na Vercel.
name: news
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: true
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/coletar_news.py
      - name: Commit se houver novidade
        run: |
          git config user.name "harpya-bot"
          git config user.email "harpya-bot@users.noreply.github.com"
          git add public/data/news.json
          git diff --cached --quiet && echo "sem novidade" && exit 0
          git commit -m "news: atualização automática"
          git push
