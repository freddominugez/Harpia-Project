# Confere que o site compila em cada push e pull request.
name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test scripts/test_midpage_ad.mjs scripts/test_anuncios.mjs scripts/test_ambientes.mjs scripts/test_business_schema.mjs scripts/test_business_admin.mjs
      - run: npm run build
      - run: node scripts/test_business_build.mjs
      - run: npx astro check
      - run: pip install pyyaml==6.0.3 -r scripts/requirements.txt && python3 scripts/validar_cms.py
      - run: python3 -m unittest discover -s scripts -p 'test_business*.py'
