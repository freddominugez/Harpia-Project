# Lighthouse CI: SEO e acessibilidade travam o PR; desempenho e Core Web Vitals avisam.
name: lighthouse
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["curadoria/**", "docs/**", "public/data/news.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
