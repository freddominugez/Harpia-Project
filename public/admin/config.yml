# GERADO por scripts/gerar_config_cms.py a partir de scripts/cms-config.fonte.yml.
# Não edite aqui: edite a fonte e rode o script.
# Painel de conteúdo do Harpya (Sveltia CMS). Documentação: docs/PAINEL_ADMIN.md.

backend:
  name: github
  repo: freddominugez/Harpia-Project
  branch: main
  commit_messages:
    create: 'Painel: cria {{collection}} {{slug}}'
    update: 'Painel: atualiza {{collection}} {{slug}}'
    delete: 'Painel: remove {{collection}} {{slug}}'
    uploadMedia: 'Painel: envia mídia {{path}}'
    deleteMedia: 'Painel: remove mídia {{path}}'
publish_mode: editorial_workflow
site_url: https://www.harpya.org
display_url: https://www.harpya.org
logo_url: https://www.harpya.org/img/harpya-mark-head.png
media_folder: public/img/conteudo
public_folder: /img/conteudo
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: caminhos
  label: Caminhos de pesquisa
  label_singular: Caminho
  folder: src/content/caminhos
  extension: md
  format: frontmatter
  create: true
  slug: '{{titulo}}'
  identifier_field: titulo
  summary: '{{numero}}. {{titulo}} · {{estatuto}}'
  sortable_fields:
  - numero
  - titulo
  - atualizado
  fields:
  - label: Número
    name: numero
    widget: number
    value_type: int
  - label: Título
    name: titulo
    widget: string
  - widget: select
    options:
    - label: medido no projeto
      value: medido
    - label: arte prévia
      value: arte
    - label: lacuna
      value: lacuna
    - label: teste ou enquadramento
      value: teste
    label: Estatuto
    name: estatuto
  - label: Selo (texto curto)
    name: selo
    widget: string
    hint: 'Ex.: arte prévia: VA-file, FEXIPRO'
  - label: Resumo
    name: resumo
    widget: text
  - label: Equação central (LaTeX)
    name: equacao
    widget: string
    required: false
  - label: Arte prévia
    name: arte_previa
    widget: list
    field:
      label: Referência
      name: ref
      widget: string
  - label: Próximo teste
    name: proximo_teste
    widget: text
  - label: Parar se
    name: parar_se
    widget: text
  - label: Linha principal
    name: principal
    widget: boolean
    default: false
  - widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
    label: Atualizado em
    name: atualizado
  - label: Texto (markdown com LaTeX entre $ e $$)
    name: body
    widget: markdown
    modes:
    - raw
- name: pautas
  label: Pautas do fórum
  label_singular: Pauta
  folder: src/content/pautas
  extension: md
  format: frontmatter
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{titulo}}'
  identifier_field: titulo
  summary: '{{titulo}} · {{status}}'
  sortable_fields:
  - proposta_em
  - titulo
  - status
  view_filters:
  - label: Propostas
    field: status
    pattern: ^proposta$
  - label: Aprovadas
    field: status
    pattern: ^aprovada$
  - label: Criadas
    field: status
    pattern: ^criada$
  fields:
  - label: Título da discussão
    name: titulo
    widget: string
  - label: Categoria no fórum
    name: categoria
    widget: select
    options:
    - Caminhos
    - Perguntas
    - Resultados e reproduções
    - Propostas novas
  - label: Caminho relacionado (slug)
    name: caminho
    widget: relation
    collection: caminhos
    value_field: '{{slug}}'
    search_fields:
    - titulo
    display_fields:
    - titulo
    required: false
  - label: Links de origem
    name: links
    widget: list
    field:
      label: URL
      name: url
      widget: string
    required: false
  - label: Status
    name: status
    widget: select
    options:
    - label: Proposta (aguardando revisão)
      value: proposta
    - label: Aprovada (será criada no fórum)
      value: aprovada
    - label: Criada no fórum
      value: criada
    - label: Descartada
      value: descartada
    default: proposta
    hint: Ao marcar Aprovada e publicar, a automação cria a discussão no GitHub.
  - label: Link da discussão
    name: discussao_url
    widget: string
    required: false
    default: ''
    hint: Preenchido pela automação.
  - widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
    label: Proposta em
    name: proposta_em
  - label: Origem
    name: origem
    widget: select
    options:
    - label: Manual
      value: manual
    - label: Curadoria diária
      value: curadoria-diaria
    default: manual
  - label: Texto de abertura
    name: body
    widget: markdown
    modes:
    - raw
- name: videos
  label: Vídeos
  label_singular: Vídeo
  folder: src/content/videos
  extension: json
  format: json
  create: true
  slug: '{{id}}'
  identifier_field: titulo
  summary: '{{titulo}} · {{canal}} · {{nivel}} · {{status}}'
  sortable_fields:
  - ordem
  - titulo
  - modulo
  - adicionado_em
  view_filters:
  - label: Rascunhos
    field: status
    pattern: ^rascunho$
  - label: Publicados
    field: status
    pattern: ^publicado$
  - label: Da curadoria diária
    field: origem
    pattern: curadoria-diaria
  view_groups:
  - label: Nível
    field: nivel
  - label: Módulo
    field: modulo
  fields:
  - label: ID do YouTube
    name: id
    widget: string
    pattern:
    - ^[A-Za-z0-9_-]{11}$
    - O ID tem 11 caracteres (o trecho depois de v= no link).
  - label: Título real do vídeo
    name: titulo
    widget: string
  - label: Canal
    name: canal
    widget: string
  - label: Módulo
    name: modulo
    widget: relation
    collection: modulos
    value_field: numero
    search_fields:
    - titulo
    display_fields:
    - '{{numero}} · {{titulo}}'
  - label: Nível
    name: nivel
    widget: select
    options:
    - Iniciante
    - Intermediário
    - Avançado
  - label: Resumo em português
    name: resumo
    widget: text
  - label: Número no catálogo original
    name: catalogo
    widget: number
    value_type: int
    required: false
  - label: Trilha
    name: trilha
    widget: select
    options:
    - label: Matemática
      value: mat
    - label: Redes neurais
      value: redes
    - label: LLMs
      value: llm
    default: llm
  - label: URL de origem
    name: fonte_url
    widget: string
    pattern:
    - ^https?://
    - Use um endereço completo, começando com http.
  - label: Status
    name: status
    widget: select
    options:
    - label: Rascunho (não aparece no site)
      value: rascunho
    - label: Publicado
      value: publicado
    default: rascunho
  - label: Origem
    name: origem
    widget: select
    options:
    - label: Manual
      value: manual
    - label: Curadoria diária
      value: curadoria-diaria
    default: manual
  - widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
    label: Adicionado em
    name: adicionado_em
  - widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
    label: Link verificado em
    name: verificado_em
    hint: Data em que o link foi conferido.
  - label: Ordem
    name: ordem
    widget: number
    value_type: int
    default: 999
    hint: Posição na lista (menor aparece primeiro).
