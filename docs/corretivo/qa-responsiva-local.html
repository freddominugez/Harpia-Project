<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conferência local Harpya — templates pareados</title><style>body{font:15px system-ui;margin:18px;color:#263039}button,select{font:inherit;padding:8px;margin:3px}#frames{display:grid;gap:12px}.box{overflow:hidden;background:#ddd;border:1px solid #999}iframe{border:0;transform-origin:top left;background:white}pre{white-space:pre-wrap;max-height:270px;overflow:auto;font-size:12px}h2{font-size:17px;margin:4px}p{margin:8px}</style><h1>Conferência local dos templates</h1><p>Quadros com largura CSS definida e viewport interno medido. A escala de exibição não altera o viewport do quadro. Este arquivo é um instrumento local de QA; não integra o projeto.</p><label>Template <select id="route"></select></label><div id="widths"></div><button id="sweep">Medir treze pares nas cinco larguras</button><button id="export">Exportar medidas</button><button id="figure">Mostrar primeira figura</button><button id="top">Voltar ao início</button><pre id="status">Aguardando.</pre><div id="frames"></div><script>
const pairs=[['Home','/tecnologia/','/business/'],['Origens','/origens/','/business/origens/'],['Aprendizado','/aprendizado/','/business/aprendizado/'],['Estudos','/estudos/','/business/estudos/'],['Investigação','/estudos/a-ideia-mais-interessante/','/business/estudos/a-ideia-mais-interessante/'],['Começando','/comecando/','/business/comecando/'],['Artigo ilustrado','/comecando/proxima-palavra/','/business/comecando/valor-e-mercado/'],['Análise','/analises/computacao-quantica-util-parte-1/','/business/analises/atribuicao-incrementalidade/'],['Notícias','/noticias/','/business/noticias/'],['Biblioteca','/biblioteca/','/business/biblioteca/'],['Ficha de estudo','/estudos/caminhos/certificado-inteiro/','/business/estudos/caminhos/fundamentos/'],['Equações e métodos','/equacoes/','/business/equacoes/'],['Vídeos','/videos/','/business/videos/']];
const widths=[360,390,1024,1440,1672];let selected=390,results=[],busy=false;const route=document.querySelector('#route'),status=document.querySelector('#status'),frames=document.querySelector('#frames');pairs.forEach((p,i)=>route.add(new Option(p[0],i)));for(const width of widths){const b=document.createElement('button');b.textContent=width+' px';b.onclick=()=>{selected=width;show()};document.querySelector('#widths').append(b)}
function metric(f,label){const w=f.contentWindow,d=f.contentDocument,r=d.documentElement;const rail=d.querySelector('.ad-rail'),main=d.querySelector('main'),header=d.querySelector('header');return{ambiente:label,viewport:w.innerWidth,documento:r.scrollWidth,sem_excesso_horizontal:r.scrollWidth<=w.innerWidth,h1:d.querySelectorAll('h1').length,erros_katex:d.querySelectorAll('.katex-error').length,largura_main:Math.round(main?.getBoundingClientRect().width??0),fonte_main:main?w.getComputedStyle(main).fontFamily:'',rail:rail?w.getComputedStyle(rail).display:'ausente',preferencia_aberta:!!d.querySelector('dialog[open]'),imagens_falhas:[...d.images].filter(x=>x.complete&&!x.naturalWidth&&!x.loading.includes('lazy')).map(x=>x.getAttribute('src'))};}
async function show(i=Number(route.value),width=selected){frames.innerHTML='';const scale=Math.min(1,(document.documentElement.clientWidth-50)/width);const pair=pairs[i];await Promise.all(pair.slice(1).map((url,n)=>new Promise(resolve=>{const title=document.createElement('h2');title.textContent=(n?'Business':'Tecnologia')+' · '+url;frames.append(title);const box=document.createElement('div');box.className='box';box.style.height=620*scale+'px';const f=document.createElement('iframe');f.title=(n?'Business':'Tecnologia')+' '+pair[0];f.width=width;f.height=620;f.style.transform='scale('+scale+')';box.append(f);frames.append(box);let timer=setTimeout(()=>resolve({ambiente:n?'Business':'Tecnologia',erro:'tempo de carga excedido'}),12000);f.onload=async()=>{clearTimeout(timer);await f.contentDocument.fonts.ready;resolve(metric(f,n?'Business':'Tecnologia'))};f.src=url;}))).then(ms=>{const result={template:pair[0],largura:width,medidas:ms};status.textContent=JSON.stringify(result,null,2);results.push(result)});}
document.querySelector('#export').onclick=()=>{const payload={data:'2026-11-06',metodo:'Dois quadros same-origin por par, viewport interno medido; sem diff de pixels; imagens lazy ainda não carregadas não são consideradas falhas',larguras:widths,altura:620,resultados:results};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='harpya-business-qa-responsiva.json';a.click();URL.revokeObjectURL(a.href);};route.onchange=()=>show();document.querySelector('#figure').onclick=()=>{for(const f of frames.querySelectorAll('iframe'))f.contentDocument.querySelector('main figure, main svg[role="img"], main .orig-people')?.scrollIntoView({block:'start'})};document.querySelector('#top').onclick=()=>{for(const f of frames.querySelectorAll('iframe'))f.contentWindow.scrollTo(0,0)};
document.querySelector('#sweep').onclick=async()=>{if(busy)return;busy=true;results=[];for(let i=0;i<pairs.length;i++)for(const width of widths){status.textContent='Medindo '+pairs[i][0]+' em '+width+' px';await show(i,width)}status.textContent=JSON.stringify({pares:results.length,excessos:results.filter(r=>r.medidas.some(m=>m.sem_excesso_horizontal===false)),falhas:results.filter(r=>r.medidas.some(m=>m.erro||m.h1!==1||m.erros_katex||m.imagens_falhas.length)),resultados:results},null,2);busy=false;};show();
</script></html>
